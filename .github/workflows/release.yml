name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: RSVP-Reader-Windows
            asset_name: RSVP-Reader-Windows.exe
            artifact_path: dist/RSVP Reader.exe
          - os: macos-latest
            artifact_name: RSVP-Reader-macOS
            asset_name: RSVP-Reader-macOS.dmg
            artifact_path: dist/RSVP Reader.app
          - os: ubuntu-latest
            artifact_name: RSVP-Reader-Linux
            asset_name: RSVP-Reader-Linux
            artifact_path: dist/RSVP Reader

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-xkb1 \
            libegl1 \
            libxcb-shape0 \
            libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: pyinstaller rsvp.spec

      # ----------- macOS: sign, notarize, staple -----------
      - name: Import signing certificate into keychain
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          # Decode the base64 .p12 secret to a file
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          # Create a throwaway keychain just for this build
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the cert + private key
          security import "$CERT_PATH" \
            -P "$MACOS_CERTIFICATE_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Allow codesign to use the key without a UI prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Put the new keychain at the front of the search list (keep the user keychain too)
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Show what identities are visible (sanity check; safe to print)
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Codesign app bundle (hardened runtime, deep)
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="dist/RSVP Reader.app"

          # Sign every nested binary first, then the bundle, with hardened runtime + timestamp.
          /usr/bin/codesign \
            --force \
            --deep \
            --options runtime \
            --timestamp \
            --entitlements packaging/macos/entitlements.plist \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$APP"

          # Verify
          /usr/bin/codesign --verify --strict --verbose=2 "$APP"
          /usr/bin/codesign --display --verbose=4 "$APP" | head -20

      - name: Notarize and staple
        if: runner.os == 'macOS'
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          APP="dist/RSVP Reader.app"
          NOTARY_ZIP="$RUNNER_TEMP/RSVP-Reader-notary.zip"

          # ditto preserves bundle structure (zip CLI mangles symlinks/perms)
          /usr/bin/ditto -c -k --keepParent "$APP" "$NOTARY_ZIP"

          # Submit and wait for the result (Apple usually takes 1-5 min)
          xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --wait

          # Staple the ticket onto the .app so it works offline
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      # ----------- macOS: build DMG, sign, notarize, staple -----------
      - name: Build DMG (drag-to-Applications layout)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install create-dmg

          APP="dist/RSVP Reader.app"
          DMG="dist/${{ matrix.asset_name }}"

          create-dmg \
            --volname "RSVP Reader" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "RSVP Reader.app" 175 190 \
            --hide-extension "RSVP Reader.app" \
            --app-drop-link 425 190 \
            --no-internet-enable \
            "$DMG" \
            "$APP"

      - name: Codesign DMG
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          DMG="dist/${{ matrix.asset_name }}"
          /usr/bin/codesign \
            --force \
            --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$DMG"
          /usr/bin/codesign --verify --verbose=2 "$DMG"

      - name: Notarize and staple DMG
        if: runner.os == 'macOS'
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="dist/${{ matrix.asset_name }}"

          xcrun notarytool submit "$DMG" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --wait

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Clean up keychain
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12"

      # ----------- Rename non-macOS artifacts -----------
      - name: Rename artifact for release (Windows)
        if: runner.os == 'Windows'
        run: |
          copy "dist\RSVP Reader.exe" "dist\${{ matrix.asset_name }}"

      - name: Rename artifact for release (Linux)
        if: runner.os == 'Linux'
        run: |
          cp "dist/RSVP Reader" "dist/${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/RSVP-Reader-Windows/RSVP-Reader-Windows.exe
            artifacts/RSVP-Reader-macOS/RSVP-Reader-macOS.dmg
            artifacts/RSVP-Reader-Linux/RSVP-Reader-Linux
          generate_release_notes: true
          draft: false
          prerelease: false
