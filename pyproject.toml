[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsvp-reader"
dynamic = ["version"]
description = "Rapid Serial Visual Presentation (RSVP) speed reading application"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "PyQt6>=6.4.0,<7",
    "requests>=2.28.0,<3",
    "beautifulsoup4>=4.11.0,<5",
    "pyperclip>=1.8.0,<2",
    "ebooklib>=0.18,<1",
    "pymupdf>=1.23.0,<2",
    "pyttsx3>=2.90,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.0.0",
    "pytest-cov>=4.0.0",
    "pyinstaller>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
rsvp = "rsvp.main:main"

[project.gui-scripts]
rsvp-gui = "rsvp.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rsvp*"]

[tool.setuptools.dynamic]
version = {attr = "rsvp.__version__"}

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["build", "dist", "rsvp_reader.egg-info"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long: covered by formatter
    "B008",  # function-call-in-default-argument (false positives with Qt)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts inside tests are fine
"rsvp/core/__init__.py" = ["F401"]  # re-exports
"rsvp/ui/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
files = ["rsvp"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
# PyQt6 stubs return QMenuBar | None / QMenu | None for some methods that
# never actually return None at runtime; suppress the spurious union-attr
# errors that result. Third-party libs (pyperclip, pyttsx3, requests,
# fitz/pymupdf) don't ship type stubs — import-untyped covers the
# residual for libs that ARE installed but lack py.typed. Real type
# errors still surface.
disable_error_code = ["union-attr", "import-untyped"]
