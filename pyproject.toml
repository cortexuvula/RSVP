[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsvp-reader"
dynamic = ["version"]
description = "Rapid Serial Visual Presentation (RSVP) speed reading application"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "PyQt6>=6.4.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "pyperclip>=1.8.0",
    "ebooklib>=0.18",
    "pymupdf>=1.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.0.0",
    "pytest-cov>=4.0.0",
    "pyinstaller>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
rsvp = "rsvp.main:main"

[project.gui-scripts]
rsvp-gui = "rsvp.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rsvp*"]

[tool.setuptools.dynamic]
version = {attr = "rsvp.__version__"}

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["build", "dist", "rsvp_reader.egg-info"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long: covered by formatter
    "B008",  # function-call-in-default-argument (false positives with Qt)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts inside tests are fine
"rsvp/core/__init__.py" = ["F401"]  # re-exports
"rsvp/ui/__init__.py" = ["F401"]
